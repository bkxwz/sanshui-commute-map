<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<style>
  :root{
    --green:#16a34a;
    --lime:#65a30d;
    --amber:#f59e0b;
    --red:#ef4444;
    --ink:#0f172a;
    --muted:#64748b;
    --line:#e2e8f0;
    --bg:#f8fafc;
    --panel:#ffffff;
    --accent:#0f766e;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;}
  body{
    font-family:"PingFang SC","Microsoft YaHei","Helvetica Neue",Arial,sans-serif;
    color:var(--ink);
    background:var(--bg);
    overflow:hidden;
  }
  #app{display:flex;height:100vh;width:100vw;}

  /* ---------- 侧栏 ---------- */
  #panel{
    width:392px;min-width:392px;height:100%;
    background:var(--panel);
    border-right:1px solid var(--line);
    display:flex;flex-direction:column;
    z-index:1000;
    box-shadow:2px 0 18px rgba(15,23,42,.05);
  }
  #panel header{
    padding:18px 20px 14px;
    border-bottom:1px solid var(--line);
    background:linear-gradient(135deg,#0f766e,#115e59);
    color:#fff;
  }
  #panel header h1{
    margin:0 0 6px;font-size:19px;font-weight:700;letter-spacing:.3px;
  }
  #panel header .sub{
    font-size:12.5px;opacity:.9;display:flex;align-items:center;gap:6px;
  }
  #panel header .sub .dot{
    width:7px;height:7px;border-radius:50%;background:#5eead4;
    box-shadow:0 0 0 3px rgba(94,234,212,.25);
  }

  .controls{padding:14px 18px 10px;border-bottom:1px solid var(--line);}
  .seg{
    display:flex;background:#f1f5f9;border-radius:10px;padding:3px;gap:3px;margin-bottom:10px;
  }
  .seg button{
    flex:1;border:0;background:transparent;padding:8px 0;border-radius:8px;
    font-size:13px;font-weight:600;color:var(--muted);cursor:pointer;
    font-family:inherit;transition:.18s;
  }
  .seg button.active{background:#fff;color:var(--ink);box-shadow:0 1px 4px rgba(15,23,42,.12);}
  .toggles{display:flex;flex-wrap:wrap;gap:8px;font-size:12.5px;color:var(--muted);}
  .toggles label{display:flex;align-items:center;gap:6px;cursor:pointer;user-select:none;}
  .toggles input{accent-color:var(--accent);width:14px;height:14px;cursor:pointer;}

  #cards{flex:1;overflow-y:auto;padding:12px 14px 20px;}
  #cards::-webkit-scrollbar{width:7px;}
  #cards::-webkit-scrollbar-thumb{background:#cbd5e1;border-radius:4px;}

  .card{
    border:1px solid var(--line);border-radius:12px;padding:12px 13px;margin-bottom:10px;
    background:#fff;cursor:pointer;transition:.18s;position:relative;overflow:hidden;
  }
  .card:hover{border-color:#94a3b8;transform:translateY(-1px);box-shadow:0 6px 16px rgba(15,23,42,.08);}
  .card.dim{opacity:.42;filter:grayscale(.5);}
  .card .top{display:flex;justify-content:space-between;align-items:flex-start;gap:8px;}
  .card .name{font-size:14px;font-weight:700;line-height:1.35;}
  .card .role{font-size:12px;color:var(--muted);margin-top:2px;}
  .badge{
    flex:0 0 auto;border-radius:999px;padding:3px 9px;font-size:11.5px;font-weight:700;color:#fff;
    white-space:nowrap;
  }
  .card .meta{
    display:flex;flex-wrap:wrap;gap:6px 12px;margin-top:9px;font-size:12px;color:#475569;
  }
  .card .meta b{color:var(--ink);font-weight:700;}
  .card .plan{
    margin-top:8px;font-size:11.5px;color:#475569;background:#f8fafc;border-radius:8px;
    padding:6px 9px;line-height:1.5;border-left:3px solid #cbd5e1;
  }
  .card .tag{
    display:inline-block;font-size:10.5px;padding:1px 6px;border-radius:4px;
    background:#ecfdf5;color:#047857;margin-left:6px;font-weight:600;
  }
  .card .tag.expired{background:#fef2f2;color:#b91c1c;}
  .card .tag.none{background:#f1f5f9;color:#64748b;}

  .bar-wrap{margin-top:9px;height:5px;background:#f1f5f9;border-radius:3px;overflow:hidden;}
  .bar{height:100%;border-radius:3px;transition:width .4s ease;}

  .section-title{
    font-size:11px;font-weight:700;color:#94a3b8;letter-spacing:1px;
    text-transform:uppercase;margin:6px 4px 9px;
  }

  /* ---------- 地图 ---------- */
  #map{flex:1;height:100%;background:#eef2f6;}

  .home-pin{
    width:44px;height:44px;border-radius:50%;
    background:#0f766e;border:3px solid #fff;
    box-shadow:0 3px 14px rgba(15,118,110,.45);
    display:flex;align-items:center;justify-content:center;
    color:#fff;font-size:19px;
  }
  .home-pin::after{
    content:"";position:absolute;inset:-9px;border-radius:50%;
    border:2px solid rgba(15,118,110,.35);
    animation:pulse 2.4s infinite;
  }
  @keyframes pulse{
    0%{transform:scale(.85);opacity:.9;}
    70%{transform:scale(1.35);opacity:0;}
    100%{opacity:0;}
  }

  .job-pin{
    display:flex;align-items:center;gap:5px;
    background:#fff;border:2px solid var(--c);
    border-radius:999px;padding:3px 8px 3px 5px;
    box-shadow:0 3px 10px rgba(15,23,42,.18);
    font-size:12px;font-weight:700;color:var(--ink);white-space:nowrap;
    cursor:pointer;transition:.15s;

  .job-pin .num{

    display:flex;align-items:center;justify-content:center;font-size:11px;
  }
  .job-pin .t{color:var(--c);}
  .job-pin .m{font-weight:600;color:#64748b;font-size:10.5px;}

  .leaflet-popup-content-wrapper{border-radius:12px;box-shadow:0 10px 30px rgba(15,23,42,.18);}
  .leaflet-popup-content{margin:13px 15px;font-size:12.5px;line-height:1.6;}
  .pop h3{margin:0 0 3px;font-size:14.5px;}
  .pop .r{color:#64748b;margin-bottom:8px;font-size:12px;}
  .pop .row{display:flex;justify-content:space-between;gap:12px;padding:3px 0;border-bottom:1px dashed #eef2f7;}
  .pop .row:last-of-type{border-bottom:0;}
  .pop .row span:first-child{color:#64748b;}
  .pop .row b{font-weight:700;}
  .pop .bus{margin-top:8px;background:#f8fafc;border-radius:8px;padding:7px 9px;font-size:11.5px;color:#475569;line-height:1.55;}

  .legend{
    position:absolute;right:16px;bottom:22px;z-index:800;
    background:rgba(255,255,255,.96);border:1px solid var(--line);
    border-radius:12px;padding:11px 14px;font-size:12px;
    box-shadow:0 6px 20px rgba(15,23,42,.12);line-height:1.9;
  }
  .legend .l{display:flex;align-items:center;gap:7px;}
  .legend .sw{width:11px;height:11px;border-radius:3px;}

  .hint{
    position:absolute;left:50%;top:14px;transform:translateX(-50%);z-index:800;
    background:rgba(15,23,42,.86);color:#fff;font-size:12px;
    padding:7px 15px;border-radius:999px;pointer-events:none;
    transition:opacity .5s;white-space:nowrap;
  }

  .srcnote{
    position:absolute;left:16px;bottom:22px;z-index:800;
    background:rgba(255,255,255,.96);border:1px solid var(--line);
    border-radius:10px;padding:8px 12px;font-size:11.5px;color:#64748b;
    box-shadow:0 4px 14px rgba(15,23,42,.1);line-height:1.6;max-width:280px;
  }
  .srcnote b{color:#0f766e;}

  #tilefail{
    position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);
    z-index:700;background:#fff;border:1px solid var(--line);border-radius:12px;
    padding:16px 20px;font-size:13px;color:#475569;display:none;text-align:center;
    box-shadow:0 10px 30px rgba(15,23,42,.12);line-height:1.7;
  }

  @media (max-width: 820px){
    #app{flex-direction:column-reverse;}
    #panel{width:100%;min-width:0;height:52vh;border-right:0;border-top:1px solid var(--line);}
    #map{height:48vh;}
    .legend{display:none;}
    #panel header{padding:12px 16px 10px;}
    #panel header h1{font-size:16px;}
  }
</style>
</head>

function statusOf(min){
  if (min <= 15) return { c: COLORS.green, label: "15 分钟内", key:"green" };
  if (min <= 30) return { c: COLORS.lime,  label: "15–30 分钟", key:"lime" };

}

function curvePoints(a, b, bend){
  const pts = [];
  const mx = (a[0]+b[0])/2, my = (a[1]+b[1])/2;
  const dx = b[0]-a[0], dy = b[1]-a[1];
  const cx = mx - dy*bend, cy = my + dx*bend;
  for (let t=0; t<=1.0001; t+=0.02){
    const x = (1-t)*(1-t)*a[0] + 2*(1-t)*t*cx + t*t*b[0];
    const y = (1-t)*(1-t)*a[1] + 2*(1-t)*t*cy + t*t*b[1];
    pts.push([x,y]);
  }
  return pts;
}

    <div class="row"><span>发布状态</span><b>${job.posted}</b></div>
    <div class="bus"><b>公交方案：</b>${job.bus.plan}<br><span style="color:#94a3b8">${job.bus.headway}</span></div>
  </div>`;
}

function render(){
  jobLayer.clearLayers();
  lineLayer.clearLayers();

  const visible = JOBS.filter(j => !onlyOpen || j.state === "active");
  const sorted = [...visible].sort((a,b) => timeFor(a,mode==="both"?"ebike":mode) - timeFor(b,mode==="both"?"ebike":mode));

  sorted.forEach((job, i) => {
    const min = timeFor(job, mode === "both" ? "ebike" : mode);
    const st = statusOf(min);
    const num = i + 1;

    const html = `<div class="job-pin" style="--c:${st.c}">
        <span class="num">${num}</span>
        <span class="t">${min}′</span>
        <span class="m">${mode==="bus"?"公交":mode==="both"?"🛵":"电动车"}</span>
      </div>`;
    const icon = L.divIcon({ className:"", html, iconSize:[null,null], iconAnchor:[24,14] });

    const marker = L.marker([job.lat, job.lng], { icon }).addTo(jobLayer);
    marker.bindPopup(popupHtml(job), { maxWidth:300 });
    marker.bindTooltip(`${job.name} · ${job.role}`, { direction:"top", offset:[0,-12] });
    marker.on("click", () => highlightCard(job.id));

    /* 通勤连线 */
    const color = mode === "bus" ? statusOf(job.bus.min).c : st.c;
    const pts = curvePoints([HOME.lat, HOME.lng], [job.lat, job.lng], 0.12 + (i%3)*0.03);
    const line = L.polyline(pts, {
      color, weight: mode==="both" ? 2 : 2.6, opacity:.55,
      dashArray: mode === "bus" ? "7 6" : null
    }).addTo(lineLayer);
    line.on("click", () => marker.openPopup());
  });

  renderCards(sorted);
  ring.setStyle({ opacity: mode === "bus" ? 0 : 1, fillOpacity: mode === "bus" ? 0 : .045 });
  document.getElementById("showRing").disabled = (mode === "bus");
}

function renderCards(sorted){
  const box = document.getElementById("cards");
  if (!sorted.length){
    box.innerHTML = `<div style="padding:30px 10px;text-align:center;color:#94a3b8;font-size:13px">当前筛选下没有岗位</div>`;
    return;
  }
  const maxMin = Math.max(...sorted.map(j => Math.max(j.ebike.min, j.bus.min)), 60);

  box.innerHTML = `<div class="section-title">按通勤时间排序 · 共 ${sorted.length} 个</div>` +
    sorted.map((job, i) => {
      const eb = statusOf(job.ebike.min);
      const bu = statusOf(job.bus.min);
      const primary = mode === "bus" ? bu : eb;
      const primaryMin = mode === "bus" ? job.bus.min : job.ebike.min;
      const barW = Math.min(100, primaryMin / maxMin * 100);
      const stateTag = job.state === "active" ? '<span class="tag">在招</span>'
                     : job.state === "expired" ? '<span class="tag expired">已截止</span>'
                     : '<span class="tag none">近期无岗</span>';
      return `<div class="card ${job.state==='none'?'dim':''}" data-id="${job.id}">
        <div class="top">
          <div>
            <div class="name">${i+1}. ${job.name}${stateTag}</div>
            <div class="role">${job.role} · ${job.area}</div>
          </div>
          <div class="badge" style="background:${primary.c}">${primaryMin}′</div>
        </div>
        <div class="meta">
          <span>🛵 <b style="color:${eb.c}">${job.ebike.min} 分钟</b> / ${job.ebike.km}km</span>
          <span>🚌 <b style="color:${bu.c}">${job.bus.min} 分钟</b></span>
        </div>
        <div class="bar-wrap"><div class="bar" style="width:${barW}%;background:${primary.c}"></div></div>
        <div class="plan">${job.star}</div>
      </div>`;
    }).join("");

  box.querySelectorAll(".card").forEach(el => {
    el.addEventListener("click", () => focusJob(el.dataset.id));
  });
}

function focusJob(id){
  const job = JOBS.find(j => j.id === id);
  if (!job) return;
  map.flyTo([job.lat, job.lng], 14, { duration:.75 });
  setTimeout(() => {
    const layers = [];
    jobLayer.eachLayer(l => { if (l.getLatLng && l.getLatLng().lat === job.lat) layers.push(l); });
    if (layers[0]) layers[0].openPopup();
  }, 780);
}

function highlightCard(id){
  document.querySelectorAll(".card").forEach(c => {
    c.style.borderColor = c.dataset.id === id ? "#0f766e" : "";
    c.style.background  = c.dataset.id === id ? "#f0fdfa" : "";
  });
  const target = document.querySelector(`.card[data-id="${id}"]`);
  if (target) target.scrollIntoView({ behavior:"smooth", block:"nearest" });
}

/* ---------------- 交互 ---------------- */
document.querySelectorAll("#modeSeg button").forEach(btn => {
  btn.addEventListener("click", () => {
    document.querySelectorAll("#modeSeg button").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    mode = btn.dataset.mode;
    render();
  });
});

document.getElementById("onlyOpen").addEventListener("change", e => {
  onlyOpen = e.target.checked;
  render();
});

document.getElementById("showRing").addEventListener("change", e => {
  if (e.target.checked) ring.addTo(map); else map.removeLayer(ring);
});

/* 首次加载：以万达为圆心聚焦通勤圈，远处岗位仍可拖拽查看 */
map.setView([HOME.lat, HOME.lng], 12);

render();

setTimeout(() => {
  const h = document.getElementById("hint");
  h.style.opacity = "0";
}, 5200);
</script>
</body>
</html>
